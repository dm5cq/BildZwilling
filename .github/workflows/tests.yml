# Automatische Tests bei jedem Push – auf Windows, macOS und Linux.
# Hätte die beiden Windows-Fehler aus 1.5/2.0 schon vor dem Build gefunden.
name: Tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install coverage pyright
      - run: python -m coverage run --source=bildzwilling -m unittest discover -s tests -v
      - run: python -m coverage report --skip-empty --sort=cover
      - run: python -m unittest tests/optional_formats.py -v
        continue-on-error: true
      - name: Typprüfung (Pyright)
        run: python -m pyright
  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-build.txt
      - run: python DEV/make_third_party.py
      - run: >
          python -m PyInstaller --noconfirm --onefile --windowed --name BildZwilling
          --icon assets/icon.ico --version-file version_info.txt --add-data "assets;assets"
          --add-data "LICENSE;." --add-data "THIRD_PARTY_LICENSES.txt;."
          --collect-all rawpy --collect-all pillow_heif --collect-submodules send2trash
          --hidden-import exifread --hidden-import bildzwilling.i18n_en main.py
      - uses: actions/upload-artifact@v4
        with:
          name: BildZwilling-Windows
          path: dist/BildZwilling.exe
